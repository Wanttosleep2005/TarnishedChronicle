name: Release Windows Installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:data
      - run: npm run smoke
      - run: npm run package
      - name: Build writable runtime archive
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $PWD 'release\win-unpacked'
          if (-not (Test-Path (Join-Path $runtimeRoot 'TarnishedChronicle.exe'))) {
            throw 'The unpacked runtime is missing TarnishedChronicle.exe.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $runtimeZip = Join-Path $PWD "release\TarnishedChronicle-runtime-$version.zip"
          if (Test-Path $runtimeZip) { Remove-Item $runtimeZip -Force }
          Compress-Archive -Path (Join-Path $runtimeRoot '*') -DestinationPath $runtimeZip -CompressionLevel Optimal
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem release -Filter '*.exe' | Select-Object -ExpandProperty FullName),
            (Get-ChildItem release -Filter 'latest.yml' | Select-Object -ExpandProperty FullName),
            (Get-ChildItem release -Filter '*.blockmap' | Select-Object -ExpandProperty FullName),
            (Get-ChildItem release -Filter 'TarnishedChronicle-runtime-*.zip' | Select-Object -ExpandProperty FullName)
          )
          if ($assets.Count -lt 4) { throw 'Release assets are incomplete.' }
          gh release create $env:GITHUB_REF_NAME $assets --generate-notes
